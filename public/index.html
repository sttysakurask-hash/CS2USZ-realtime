<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS2USZ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f4f5f7;font:14px Arial,sans-serif}.header{height:74px;padding:0 7%;display:flex;align-items:center;border-bottom:1px solid #20242b;background:#0b0d11}.logo{font-size:25px;font-weight:900}.logo span{color:#ff9d00}nav{margin-left:45px;color:#9ba2ad}.hero{padding:60px 7%;background:radial-gradient(circle at 75% 45%,#34270d,#101218 35%,#080a0e 70%)}.eyebrow{font-size:10px;letter-spacing:3px;color:#ff9d00;font-weight:bold}.hero h1{font-size:52px;margin:12px 0}.hero p{color:#9aa1ac}.servers{padding:50px 7%}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#101319;border:1px solid #242831;border-radius:14px;padding:20px}.top{display:flex;align-items:center;gap:12px}.icon{width:44px;height:44px;border-radius:10px;background:#1b1e25;display:grid;place-items:center;font-size:20px}.top h3{margin:0}.top small{color:#707885}.status{margin-left:auto;font-size:9px}.ok{color:#65ce8a}.bad{color:#ff6666}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.stats div{background:#0b0d11;border-radius:8px;padding:11px 8px}.stats b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats span{color:#68717d;font-size:9px}.ip{background:#0b0d11;border-radius:8px;padding:10px;color:#9ba2ad;font:11px monospace;margin-bottom:10px}.btn{width:100%;border:0;background:#ff9d00;color:#111;font-weight:900;padding:13px;border-radius:7px;cursor:pointer}.note{color:#68717d;font-size:11px;margin-top:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="header"><div class="logo">CS2<span>USZ</span></div><nav>Serverlar</nav></header>
<section class="hero"><div class="eyebrow">COUNTER-STRIKE 2 COMMUNITY</div><h1>CS2USZ serverlari</h1><p>Real-time server holati: o‘yinchilar, map va ping.</p></section>
<section class="servers"><div class="grid" id="grid"></div><div class="note">Ma'lumotlar har 15 soniyada yangilanadi.</div></section>
<script>
const icon=t=>t==="Duels"?"⚔":t==="Public"?"🎯":"☠";
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function card(s){return `<article class="card"><div class="top"><div class="icon">${icon(s.type)}</div><div><h3>${esc(s.name)}</h3><small>${esc(s.type)}</small></div><div class="status">${s.online?'<span class="ok">● ONLINE</span>':'<span class="bad">● OFFLINE</span>'}</div></div><div class="stats"><div><b>${s.online?s.players+"/"+s.maxPlayers:"—"}</b><span>O‘yinchilar</span></div><div><b>${esc(s.map)}</b><span>Map</span></div><div><b>${s.online&&s.ping!==null?s.ping+" ms":"—"}</b><span>Ping</span></div></div><div class="ip">${esc(s.host+":"+s.port)}</div><button class="btn" onclick="connectTo('${s.host}:${s.port}')">CONNECT</button></article>`}
async function load(){try{const d=await (await fetch("/api/servers")).json();document.getElementById("grid").innerHTML=d.servers.map(card).join("")}catch(e){}}
function connectTo(ip){navigator.clipboard?.writeText(ip);alert("IP nusxalandi!\\nCS2 konsolida: connect "+ip)}
load();setInterval(load,15000);
</script></body></html>
